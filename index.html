<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPGEF | Acesso ao Dashboard</title>
  <script src="./auth.js"></script>
  <style>
    :root {
      --bg: #f4f1eb;
      --panel: rgba(255, 252, 247, 0.96);
      --ink: #262930;
      --muted: #6d727c;
      --primary: #8c1538;
      --primary-strong: #6e0f2d;
      --accent: #d4a017;
      --line: rgba(140, 21, 56, 0.12);
      --shadow: 0 24px 70px rgba(38, 41, 48, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(212, 160, 23, 0.18), transparent 24%),
        linear-gradient(135deg, rgba(140, 21, 56, 0.1), transparent 28%),
        linear-gradient(180deg, #f9f6f1 0%, var(--bg) 100%);
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(100%, 560px);
      padding: 34px 32px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), var(--panel));
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .intro {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .login-form {
      display: grid;
      gap: 12px;
    }

    label {
      font-weight: 700;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(38, 41, 48, 0.15);
      border-radius: 14px;
      background: white;
      color: var(--ink);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(140, 21, 56, 0.12);
    }

    button {
      margin-top: 4px;
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: white;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.03);
    }

    .error {
      margin: 0;
      color: #b42318;
      font-size: 0.92rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main data-login-root></main>
  <script>
    window.ppgefStaticAuth.initLoginPage();
  </script>
</body>
</html>

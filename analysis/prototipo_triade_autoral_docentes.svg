  <text x="52" y="66" font-size="32" font-weight="700" fill="#262930">Protótipo: Tríade Autoral dos Docentes</text>
  <text x="52" y="94" font-size="17" fill="#6d727c">Proposta superior ao radar: mapa ternário com todos os docentes + barras 100% empilhadas para comparação direta.</text>

  <text x="52" y="136" font-size="22" font-weight="700" fill="#262930">Mapa Triangular de Perfis</text>
  <text x="52" y="160" font-size="14" fill="#6d727c">Cada ponto é um docente. O tamanho do ponto representa o número de obras válidas. Quanto mais perto de um vértice, maior a concentração naquele perfil autoral.</text>

